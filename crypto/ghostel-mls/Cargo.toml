[package]
name = "ghostel-mls"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
openmls = "=0.9.0"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
thiserror = "2"
base64 = "0.22"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
wasm-bindgen = "=0.2.128"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
