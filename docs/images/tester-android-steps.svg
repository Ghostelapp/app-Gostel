<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jak dolaczyc do testow Ghostel na Androidzie</title>
  <desc id="desc">Instrukcja krok po kroku: otworz APK, pobierz plik, zezwol na instalacje i uruchom aplikacje.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131b"/>
      <stop offset="100%" stop-color="#101f2a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132635"/>
      <stop offset="100%" stop-color="#173345"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="90" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Android - testy Ghostel</text>
  <text x="90" y="155" fill="#8bdcff" font-family="Arial, Helvetica, sans-serif" font-size="26">Wersja testowa: 1.4.33 (33)</text>

  <g transform="translate(80,220)">
    <rect width="320" height="520" rx="28" fill="url(#card)" stroke="#33cfff" stroke-width="2"/>
    <circle cx="58" cy="62" r="28" fill="#22c55e"/>
    <text x="48" y="72" fill="#08131b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1</text>
    <text x="40" y="135" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Otworz APK</text>
    <text x="40" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">Kliknij link do wersji</text>
    <text x="40" y="222" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">testowej Ghostel.</text>
    <rect x="40" y="300" width="240" height="140" rx="22" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <rect x="66" y="328" width="188" height="24" rx="12" fill="#1d4ed8"/>
    <rect x="66" y="368" width="150" height="18" rx="9" fill="#334155"/>
    <rect x="66" y="398" width="116" height="18" rx="9" fill="#334155"/>
    <text x="86" y="345" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18">Ghostel 1.4.33.apk</text>
  </g>

  <g transform="translate(440,220)">
    <rect width="320" height="520" rx="28" fill="url(#card)" stroke="#33cfff" stroke-width="2"/>
    <circle cx="58" cy="62" r="28" fill="#22c55e"/>
    <text x="48" y="72" fill="#08131b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">2</text>
    <text x="40" y="135" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700">Pobierz plik</text>
    <text x="40" y="190" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">Poczekaj na koniec</text>
    <text x="40" y="222" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">pobierania APK.</text>
    <circle cx="160" cy="360" r="84" fill="#0f172a" stroke="#33cfff" stroke-width="3"/>
    <path d="M160 304 v82" stroke="#33cfff" stroke-width="18" stroke-linecap="round"/>
    <path d="M122 354 l38 38 38-38" fill="none" stroke="#33cfff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(800,220)">
    <rect width="320" height="520" rx="28" fill="url(#card)" stroke="#33cfff" stroke-width="2"/>
    <circle cx="58" cy="62" r="28" fill="#22c55e"/>
    <text x="48" y="72" fill="#08131b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3</text>
    <text x="40" y="135" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Zezwol na</text>
    <text x="40" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">instalacje</text>
    <text x="40" y="214" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">Gdy Android zapyta,</text>
    <text x="40" y="246" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">wlacz zgode.</text>
    <rect x="42" y="302" width="236" height="132" rx="20" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <text x="64" y="350" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Zezwolic z tego zrodla?</text>
    <text x="64" y="387" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17">Instalacja Ghostel</text>
    <rect x="64" y="402" width="126" height="24" rx="12" fill="#22c55e"/>
    <text x="91" y="420" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">ZEZWOL</text>
  </g>

  <g transform="translate(1160,220)">
    <rect width="320" height="520" rx="28" fill="url(#card)" stroke="#33cfff" stroke-width="2"/>
    <circle cx="58" cy="62" r="28" fill="#22c55e"/>
    <text x="48" y="72" fill="#08131b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">4</text>
    <text x="40" y="135" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Instaluj</text>
    <text x="40" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">i otworz</text>
    <text x="40" y="214" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">Po instalacji otworz</text>
    <text x="40" y="246" fill="#d6eef8" font-family="Arial, Helvetica, sans-serif" font-size="23">aplikacje Ghostel.</text>
    <rect x="50" y="300" width="220" height="220" rx="36" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
    <circle cx="160" cy="385" r="72" fill="#22c55e"/>
    <path d="M125 387 l23 23 50-57" fill="none" stroke="#052e16" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
